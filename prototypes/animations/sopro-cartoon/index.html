<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duas versões do sopro · Discordo</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; }
body { margin: 0; padding: 30px 12px; background: #15111d; color: #f5effc; font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 790px; margin: auto; }
h1 { margin: 0 0 8px; font-size: clamp(24px,4vw,32px); letter-spacing: -.04em; }
p { color: #cbbcd6; margin: 0 0 18px; }
button { border: 0; border-radius: 7px; padding: 10px 16px; font: inherit; font-weight: 600; color: #261834; background: #ead7fa; cursor: pointer; }
button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
.comparison { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 10px; }
iframe { display: block; width: 100%; height: 690px; border: 0; }
@media(max-width: 650px) { .comparison { grid-template-columns: 1fr; } iframe { height: 640px; } }
</style>
</head>
<body>
<main>
<h1>Sopro na diagonal inferior</h1>
<p>Duas versões com movimento mais lento. A fumaça se espalha ao tocar a borda.</p>
<button id="replay" type="button">Reproduzir as duas</button>
<div class="comparison">
<iframe src="preview.html?variant=puffs&amp;clean=1" title="Simulação com tufos separados"></iframe>
<iframe src="preview.html?variant=continuous&amp;clean=1" title="Simulação com fumaça contínua"></iframe>
</div>
</main>
<script>
const frames = [...document.querySelectorAll('iframe')];
function replay() { frames.forEach(frame => frame.contentWindow.postMessage('replay-smoke', '*')); }
document.querySelector('#replay').addEventListener('click', replay);
let loaded = 0;
frames.forEach(frame => frame.addEventListener('load', () => {
  loaded++;
  if (loaded === frames.length) replay();
}));
</script>
</body>
</html>
