name: Instalador do Discordo para Windows

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag desktop existente
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validar a tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^desktop-v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Informe uma tag de versão desktop existente.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Validar a versão
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "desktop-v$version") {
            throw "A tag deve ser desktop-v$version."
          }
      - name: Instalar dependências
        run: npm --prefix desktop ci
      - name: Testar o cliente
        run: node --test tests/desktop-shortcuts.test.mjs tests/desktop-updates.test.mjs tests/desktop-screen-picker.test.mjs tests/desktop-shortcut-icon.test.mjs
      - name: Gerar instalador
        run: npm --prefix desktop run make
      - name: Verificar instalação limpa
        shell: pwsh
        run: ./desktop/test-installer.ps1 -Installer 'desktop/out/make/squirrel.windows/x64/Discordo-Setup.exe'
      - name: Gerar instalador alternativo
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $output = (Resolve-Path 'desktop/out/make/squirrel.windows/x64').Path
          & $compiler "/DAppVersion=$version" "/O$output" 'desktop/installer.iss'
          exit $LASTEXITCODE
      - name: Testar instalação alternativa
        shell: pwsh
        run: ./desktop/test-alternative-installer.ps1 -Installer 'desktop/out/make/squirrel.windows/x64/Discordo-Instalador-Windows-x64.exe'
      - name: Empacotar versão portátil
        shell: pwsh
        run: |
          $source = (Resolve-Path 'desktop/out/Discordo-win32-x64').Path
          $archive = Join-Path (Resolve-Path 'desktop/out/make/squirrel.windows/x64').Path 'Discordo-Portable-Windows-x64.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($source, $archive, [IO.Compression.CompressionLevel]::Fastest, $false)
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($name in @('Discordo.exe', 'resources/app.asar')) {
              if ($null -eq $zip.GetEntry($name)) { throw "Arquivo ausente no ZIP: $name" }
            }
          } finally { $zip.Dispose() }
      - name: Criar release em rascunho
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $output = 'desktop/out/make/squirrel.windows/x64'
          $packages = @(Get-ChildItem -LiteralPath $output -Filter '*-full.nupkg' -File)
          if ($packages.Count -ne 1) { throw 'Esperado um pacote completo para atualização.' }

          $files = @("$output/Discordo-Instalador-Windows-x64.exe", "$output/Discordo-Setup.exe", "$output/Discordo-Portable-Windows-x64.zip", "$output/RELEASES", $packages[0].FullName)
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Arquivo ausente: $file" }
          }

          $release = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($release | ConvertFrom-Json).isDraft)) { throw 'Esta versão já foi publicada.' }
            gh release upload $tag @files --clobber
          } else {
            $flags = @('--draft', '--verify-tag', '--generate-notes', '--title', "Discordo Windows $($tag.Substring(9))")
            if ($tag.Substring(9).Contains('-')) { $flags += '--prerelease' }
            gh release create $tag @files @flags
          }
          exit $LASTEXITCODE
